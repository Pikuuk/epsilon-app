<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Epsilon Academy</title>
<style>
:root{--bg:#eef2ee;--surface:#fff;--ink:#15211a;--muted:#56655b;--line:#cfd9d1;--brand:#1a2a22;--brandink:#f2f7f3;--ok:#17695c;--warn:#8a5a00;--warnbg:#fdf1d6;--bad:#a23a28;--chip:#dfe8e1;--focus:#2b6cff}
@media(prefers-color-scheme:dark){:root{--bg:#0f1712;--surface:#18231c;--ink:#e8f0ea;--muted:#9fb2a5;--line:#2c3d32;--brand:#0a110d;--ok:#52c2ad;--warn:#f0c15a;--warnbg:#3a2d0c;--bad:#ff8f7a;--chip:#22332a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{background:var(--brand);color:var(--brandink);padding:.8rem 1rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem}
.brand{font-weight:700;font-size:1.2rem}
main{max-width:860px;margin:0 auto;padding:1.1rem 1rem 3rem}
h1{font-size:1.5rem}h2{font-size:1.2rem;margin-top:1.5rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem;margin:0 0 1rem}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:.1rem .6rem;font-size:.88rem;margin:.1rem .2rem 0 0}
.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--warnbg);color:var(--bad)}.chip.ok{background:var(--chip);color:var(--ok)}
.muted{color:var(--muted);font-size:.95rem}
button{font:600 1rem system-ui;border:1px solid var(--brand);background:var(--brand);color:var(--brandink);border-radius:8px;padding:.5rem .9rem;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}button.ok{background:var(--ok);border-color:var(--ok);color:#fff}button.bad{background:transparent;color:var(--bad);border-color:var(--bad)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.5rem;max-width:100%}
label{display:block;font-weight:600;margin:.6rem 0 .2rem}
.actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem}
.row{display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap;align-items:baseline}
.warnbox{border-left:4px solid var(--bad);background:var(--warnbg);padding:.6rem .9rem;border-radius:8px;margin:.6rem 0}
.flash{padding:.6rem .9rem;border-radius:8px;background:var(--chip);margin-bottom:1rem}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
a{color:var(--ok)}
</style>
</head>
<body>
<div class="top"><span class="brand">Epsilon Academy</span><span id="whoami"></span></div>
<main id="app"><p class="muted">Loading…</p></main>
<script src="/js/index.js"></script>
</body>
</html>
