<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Epsilon Academy — Practice</title>
<style>
:root{--bg:#eef2ee;--surface:#fff;--ink:#15211a;--muted:#56655b;--line:#cfd9d1;--brand:#1a2a22;--brandink:#f2f7f3;--ok:#17695c;--warn:#8a5a00;--warnbg:#fdf1d6;--bad:#a23a28;--chip:#dfe8e1;--focus:#2b6cff}
@media(prefers-color-scheme:dark){:root{--bg:#0f1712;--surface:#18231c;--ink:#e8f0ea;--muted:#9fb2a5;--line:#2c3d32;--brand:#0a110d;--brandink:#e8f0ea;--ok:#52c2ad;--warn:#f0c15a;--warnbg:#3a2d0c;--bad:#ff8f7a;--chip:#22332a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{background:var(--brand);color:var(--brandink);padding:.8rem 1rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem}
.brand{font-weight:700}main{max-width:920px;margin:0 auto;padding:1.1rem 1rem 4rem}
h1{font-size:1.5rem}h2{font-size:1.2rem;margin-top:1.4rem}h3{font-size:1.05rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem;margin:0 0 1rem}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:.1rem .6rem;font-size:.88rem;margin:.1rem .2rem 0 0}
.muted{color:var(--muted);font-size:.95rem}
button{font:600 1rem system-ui;border:1px solid var(--brand);background:var(--brand);color:var(--brandink);border-radius:8px;padding:.5rem .9rem;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
button[disabled]{opacity:.55;cursor:not-allowed}
input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.5rem;width:100%}
.levelbar{display:flex;flex-wrap:wrap;gap:.35rem;margin:.5rem 0}
.lvpill{min-width:2.4rem;text-align:center;padding:.35rem .55rem;border-radius:8px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer;font:inherit}
.lvpill[aria-current=true]{border-color:var(--ok);background:var(--chip)}.lvpill[disabled]{opacity:.55}
.shell{display:grid;grid-template-columns:1fr;gap:1rem}@media(min-width:820px){.shell{grid-template-columns:1fr 260px}}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.6rem}
.qcell{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:.7rem}
.qcell.right{border-color:var(--ok)}.qcell.wrong{border-color:var(--warn)}
.qn{font-weight:700;color:var(--muted);font-size:.85rem}
.fbk{font-size:.92rem;margin:.4rem 0 0}.fbk.ok{color:var(--ok)}.fbk.no{color:var(--warn)}
.scoreband{position:sticky;bottom:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.6rem .8rem;margin-top:.8rem;display:flex;flex-wrap:wrap;gap:.5rem 1rem;justify-content:space-between;align-items:center}
.helpbox{background:var(--chip);border-radius:10px;padding:.7rem .9rem}
.bar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.warnbox{border-left:4px solid var(--bad);background:var(--warnbg);padding:.6rem .9rem;border-radius:8px;margin:.6rem 0}
a{color:var(--ok)}:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
dl.gloss dt{font-weight:700;margin-top:.4rem}dl.gloss dd{margin:0}
</style>
</head>
<body>
<div class="top"><span class="brand">Epsilon Academy</span><span><a href="/" style="color:#cfe">Home</a></span></div>
<main id="app"><p class="muted">Loading…</p></main>
<script src="/logic.js"></script>
<script src="/js/practice.js"></script>
</body>
</html>
